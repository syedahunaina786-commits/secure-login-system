<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sign in · SecureAuth</title>

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&family=Sora:wght@600;700;800&display=swap" rel="stylesheet">

    <link rel="stylesheet" href="{{ url_for('static', path='/style.css') }}">
    <link rel="stylesheet" href="{{ url_for('static', path='/login.css') }}">
</head>
<body>
    <!-- Ambient background orbs -->
    <div class="orb orb--violet"></div>
    <div class="orb orb--cyan"></div>

    <main class="auth-wrap">
        <section class="auth-card">
            <div class="brand">
                <div class="brand-mark">
                    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="11" width="18" height="11" rx="2"/><path d="M7 11V7a5 5 0 0 1 10 0v4"/></svg>
                </div>
                <span class="brand-name">SecureAuth</span>
            </div>

            <h1>Welcome back</h1>
            <p class="auth-sub">Sign in to your account to continue</p>

            {% if registered %}
            <div class="alert alert--success">Account created successfully — you can sign in now.</div>
            {% endif %}

            {% if msg %}
            <div class="alert alert--info">{{ msg }}</div>
            {% endif %}

            {% if error %}
            <div class="alert alert--danger">{{ error }}</div>
            {% endif %}

            <form method="post" action="/login" class="auth-form">
                <div class="field">
                    <label for="username">Username</label>
                    <div class="input-wrap">
                        <svg class="input-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M20 21v-2a4 4 0 0 0-4-4H8a4 4 0 0 0-4 4v2"/><circle cx="12" cy="7" r="4"/></svg>
                        <input type="text" id="username" name="username" placeholder="e.g. john_doe"
                               value="{{ form_username or '' }}" autocomplete="username" autofocus required>
                    </div>
                </div>

                <div class="field">
                    <label for="password">Password</label>
                    <div class="input-wrap input-wrap--toggle">
                        <svg class="input-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="11" width="18" height="11" rx="2"/><path d="M7 11V7a5 5 0 0 1 10 0v4"/></svg>
                        <input type="password" id="password" name="password" placeholder="Your password"
                               autocomplete="current-password" required>
                        <button type="button" class="input-toggle" data-toggle="password" aria-label="Show or hide password">
                            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"/><circle cx="12" cy="12" r="3"/></svg>
                        </button>
                    </div>
                </div>

                <button type="submit" class="btn btn--primary">Sign in</button>
            </form>

            <p class="auth-alt">New here? <a href="/register">Create an account</a></p>
        </section>

        <footer class="auth-foot">FastAPI · JWT (HS256) · bcrypt · Jinja2</footer>
    </main>

    <script>
        // Show / hide password toggle
        document.querySelectorAll('.input-toggle').forEach(function (btn) {
            btn.addEventListener('click', function () {
                var input = document.getElementById(btn.dataset.toggle);
                if (!input) { return; }
                var show = input.type === 'password';
                input.type = show ? 'text' : 'password';
                btn.classList.toggle('is-active', show);
            });
        });
    </script>
</body>
</html>
